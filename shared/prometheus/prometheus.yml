global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'api'

  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9100']
        labels:
          service: 'worker'
