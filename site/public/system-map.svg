<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DocuAsk reliability lab system map</title>
  <desc id="desc">A topology diagram showing browser traffic to the API, worker jobs through Redis, storage in Postgres and pgvector, LLM calls to a mock dependency, and observability through Prometheus and Grafana.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#151719" />
    </marker>
    <style>
      .label { font: 700 26px Avenir, Helvetica, sans-serif; fill: #151719; }
      .small { font: 500 18px Avenir, Helvetica, sans-serif; fill: #59616a; }
      .node { fill: #fffdf8; stroke: #151719; stroke-width: 3; rx: 12; }
      .line { fill: none; stroke: #151719; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #59616a; stroke-width: 3; stroke-dasharray: 10 10; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f7f5ef" />
  <path d="M0 120 H1200" stroke="#d7d1c4" stroke-width="2" />
  <path d="M0 520 H1200" stroke="#d7d1c4" stroke-width="2" />

  <text x="70" y="72" class="label">DocuAsk Lab Topology</text>
  <text x="70" y="102" class="small">request path, job path, failure controls, and observability</text>

  <rect x="70" y="210" width="190" height="110" class="node" />
  <text x="112" y="260" class="label">Browser</text>
  <text x="108" y="292" class="small">curl or UI</text>

  <rect x="345" y="190" width="220" height="150" class="node" />
  <rect x="345" y="190" width="220" height="22" fill="#2267a8" />
  <text x="424" y="255" class="label">API</text>
  <text x="389" y="288" class="small">FastAPI :8080</text>

  <rect x="345" y="435" width="220" height="140" class="node" />
  <rect x="345" y="435" width="220" height="22" fill="#247657" />
  <text x="396" y="500" class="label">Worker</text>
  <text x="377" y="532" class="small">Dramatiq jobs</text>

  <rect x="665" y="160" width="210" height="115" class="node" />
  <rect x="665" y="160" width="210" height="22" fill="#b7372f" />
  <text x="718" y="224" class="label">Mock LLM</text>
  <text x="706" y="252" class="small">timeouts, 503s</text>

  <rect x="665" y="330" width="210" height="115" class="node" />
  <rect x="665" y="330" width="210" height="22" fill="#b86e1f" />
  <text x="735" y="392" class="label">Redis</text>
  <text x="714" y="420" class="small">queue/cache</text>

  <rect x="665" y="500" width="210" height="115" class="node" />
  <rect x="665" y="500" width="210" height="22" fill="#30495c" />
  <text x="707" y="563" class="label">Postgres</text>
  <text x="708" y="592" class="small">pgvector chunks</text>

  <rect x="970" y="255" width="160" height="105" class="node" />
  <text x="1002" y="314" class="label">Break</text>
  <text x="996" y="342" class="small">lab scripts</text>

  <rect x="970" y="475" width="160" height="105" class="node" />
  <text x="992" y="534" class="label">Observe</text>
  <text x="996" y="562" class="small">Prom/Grafana</text>

  <path d="M260 265 H335" class="line" />
  <path d="M565 235 H655" class="line" />
  <path d="M565 300 C620 300 620 388 655 388" class="line" />
  <path d="M565 322 C620 342 618 558 655 558" class="line" />
  <path d="M455 340 V425" class="line" />
  <path d="M565 505 C615 505 620 430 655 405" class="line" />
  <path d="M565 535 C620 535 620 570 655 570" class="line" />
  <path d="M875 218 C930 218 928 292 960 306" class="dash" />
  <path d="M875 558 H960" class="dash" />
  <path d="M565 250 C760 78 1020 140 1050 245" class="dash" />
  <path d="M565 518 C780 650 1015 650 1040 585" class="dash" />
</svg>
